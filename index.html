                options: [ { text: "Chưa lấy được thông tin", score: 0 }, { text: "Chỉ đang tìm hiểu, chưa có kế hoạch cụ thể", score: 2, tag: "NURTURE" }, { text: "Đang lên ngân sách/kế hoạch cho năm tới", score: 7, tag: "EDUCATE" }, { text: "Dự kiến triển khai trong thời gian tới", score: 13, tag: "SCHEDULE" }, { text: "Cần triển khai ngay trong quý này", score: 18, tag: "URGENT_CALL" } ]
            },
            {
                id: 7, type: 'single', text: "Ngân sách cho việc triển khai hệ thống đang ở giai đoạn nào?",
                options: [ { text: "Chưa lấy được thông tin", score: 0 }, { text: "Chưa có ngân sách, chưa đề xuất", score: 2, tag: "BUILD_CASE" }, { text: "Đang trong quá trình đề xuất/xét duyệt nội bộ", score: 8, tag: "SUPPORT_PROPOSAL" }, { text: "Đã có ngân sách dự kiến, chưa được phê duyệt chính thức", score: 13, tag: "FAST_TRACK_DEMO" }, { text: "Ngân sách đã được phê duyệt", score: 18, tag: "DIRECT_PROPOSAL" } ]
            },
            {
                id: 8, type: 'single', text: "Doanh nghiệp đã từng triển khai phần mềm quản lý vận hành trước đây chưa?",
                options: [ { text: "Chưa lấy được thông tin", score: 0 }, { text: "Chưa bao giờ triển khai", score: 2 }, { text: "Đã từng thử nhưng thất bại hoặc bỏ ngang", score: 5 }, { text: "Đang sử dụng nhưng không đáp ứng đủ nhu cầu hiện tại", score: 7 }, { text: "Đã triển khai thành công và đang muốn nâng cấp", score: 9 } ]
            },
            {
                id: 9, type: 'single', text: "Điều gì quan trọng nhất với khách hàng khi lựa chọn một đối tác công nghệ logistics?",
                options: [ { text: "Chưa lấy được thông tin", score: 0 }, { text: "Giá cả và chi phí đầu tư", score: 6, tag: "PRICE_SENSITIVE" }, { text: "Tốc độ triển khai nhanh", score: 7, tag: "SPEED_DRIVEN" }, { text: "Khả năng tích hợp với hệ thống hiện có", score: 8, tag: "INTEGRATION_FOCUSED" }, { text: "Năng lực hỗ trợ và dịch vụ sau triển khai", score: 8, tag: "SERVICE_FOCUSED" }, { text: "Khả năng mở rộng theo sự tăng trưởng của doanh nghiệp", score: 10, tag: "SCALE_FOCUSED" } ]
            },
            {
                id: 10, gate: true, type: 'single', text: "Theo bạn, nhu cầu của khách có phù hợp với giải pháp Smartlog không? (CBD đánh giá — không tính điểm)",
                options: [ { text: "Phù hợp — nhu cầu khớp rõ với sản phẩm Smartlog", fit: "Phù hợp" }, { text: "Chưa rõ — cần tìm hiểu thêm", fit: "Chưa rõ" }, { text: "Không phù hợp", fit: "Không phù hợp" } ]
            }
        ];

        const THRESHOLDS = { SQL: 70, MQL: 45 }; // theo % điểm phù hợp: ≥70% → SQL, ≥45% → MQL
        const STRONG_TAGS = ["URGENT_CALL", "DIRECT_PROPOSAL"]; // luật đẩy độc lập: có tag này → đủ tầm SQL

        const CLASSES = {
            SQL: { label: "SQL Lead", emoji: "🟢", color: "bg-green-600",  desc: "Có tín hiệu mua thật & nhu cầu khớp Smartlog — chuyển Sales xử lý ngay." },
            MQL: { label: "MQL Lead", emoji: "🟡", color: "bg-yellow-500", desc: "Đúng tệp, có tiềm năng nhưng chưa đủ điều kiện SQL — MKT nuôi dưỡng." },
            Raw: { label: "Raw Lead", emoji: "⚪", color: "bg-gray-400",   desc: "Chưa đủ tín hiệu — lưu trữ & nurture chung." }
        };

        // Điểm tối đa của 1 câu tính điểm
        function questionMax(q) {
            if (q.type === 'multiple') return Math.min(q.options.reduce((s, o) => s + (o.score || 0), 0), q.cap || 15);
            return Math.max.apply(null, q.options.map(o => o.score || 0));
        }
        // Các tag sản phẩm đã chọn ở câu định tuyến
        function selectedProductTags() {
            const ans = state.answers[1];
            if (!Array.isArray(ans)) return [];
            const router = QUESTIONS.find(q => q.router);
            return ans.map(i => router.options[i] && router.options[i].tag).filter(Boolean);
        }
        // Danh sách câu đang áp dụng (định tuyến theo sản phẩm)
        function getActiveQuestions() {
            const sel = selectedProductTags();
            return QUESTIONS.filter(q => q.requiresProduct ? sel.includes(q.requiresProduct) : true);
        }

        // Đổi đáp án (index hoặc mảng index) sang chữ. Rỗng = câu không áp dụng/chưa trả lời.
        function answerToText(q, v) {
            var idxs = (v === undefined || v === null || v === '') ? [] : (Array.isArray(v) ? v : [v]);
            return idxs.map(function (i) { return (q.options[i] || {}).text || ('index ' + i); }).join(' | ');
        }
        // Toàn bộ câu trả lời dạng chữ, key = id câu (gửi kèm webhook để Sheet lưu được câu trả lời thô)
        function answersAsText(answers) {
            var out = {};
            QUESTIONS.forEach(function (q) { out[q.id] = answerToText(q, answers[q.id]); });
            return out;
        }

        const state = {
            surveyStep: 0,
            formData: { name: '', company: '', phone: '', email: '', jobTitle: '', pic: '', consulted1v1: false, bookedMeeting: false },
            answers: {},
            finished: false,
            lastResult: null
        };

        const app = {
            init() { this.render(); },

            getBackupCount() {
                try { return JSON.parse(localStorage.getItem('smartlog_leads_mkt') || '[]').length; } catch (e) { return 0; }
            },
            // Trình duyệt trong app (Zalo, Messenger...) hoặc chế độ ẩn danh có thể chặn localStorage.
            storageWorks() {
                try { localStorage.setItem('__probe__', '1'); localStorage.removeItem('__probe__'); return true; } catch (e) { return false; }
            },
            // Luôn hiện trạng thái backup: có lead / trống / bị chặn — để biết vì sao không thấy nút đẩy.
            getBackupBoxHTML() {
                var n = this.getBackupCount();
                var where = 'Bản ' + BUILD + ' · gửi kèm câu trả lời ✓ · bộ nhớ của: ' + (location.hostname || 'file') + ' · ' + (/Zalo/i.test(navigator.userAgent) ? 'trình duyệt trong Zalo' : 'trình duyệt này');
                if (n > 0) {
                    return `<div class="bg-amber-50 border border-amber-300 rounded-xl p-4 mb-6"><p class="text-sm text-amber-900 mb-2">📦 Máy này đang lưu <strong>${n}</strong> lead (bản backup trong máy). Nếu Sheet chưa nhận đủ, bấm để khôi phục:</p><div class="flex gap-2 flex-wrap"><button type="button" onclick="app.exportBackup()" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-bold">⬇ Tải CSV (kèm câu trả lời)</button><button type="button" onclick="app.resyncBackup()" class="px-4 py-2 btn-primary rounded-lg text-sm font-bold">↑ Đẩy lại lên Sheet</button></div><p class="text-[11px] text-amber-700 mt-2">${where}</p></div>`;
                }
                if (!this.storageWorks()) {
                    return `<div class="bg-red-50 border border-red-300 rounded-xl p-4 mb-6"><p class="text-sm text-red-900">⚠️ Trình duyệt này <strong>không lưu được backup</strong> (ẩn danh, hoặc trình duyệt trong app như Zalo/Messenger chặn bộ nhớ). Lead vẫn gửi lên Sheet, nhưng nếu mạng lỗi lúc gửi là mất hẳn. Nên mở link bằng <strong>Safari/Chrome</strong> rồi hãy nhập.</p><p class="text-[11px] text-red-700 mt-2">${where}</p></div>`;
                }
                return `<div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-6"><p class="text-sm text-gray-600">📦 Đang lưu <strong>0</strong> lead. Nếu bạn đã nhập lead ở đây mà vẫn thấy 0: mỗi trình duyệt/app có bộ nhớ <strong>riêng</strong> (Zalo tính là một app riêng, khác Safari/Chrome) — hãy mở lại đúng link trong <strong>đúng app đã dùng lúc nhập</strong>. Nếu vẫn 0 thì bộ nhớ đó đã bị xoá.</p><p class="text-[11px] text-gray-400 mt-2">${where}</p></div>`;
            },
            exportBackup() {
                var arr = []; try { arr = JSON.parse(localStorage.getItem('smartlog_leads_mkt') || '[]'); } catch (e) {}
                if (!arr.length) { alert('Không có lead nào lưu trên máy này.'); return; }
                var head = ["Thời gian","Họ tên","Công ty","SĐT","Email","Chức vụ","Tư vấn 1:1","Book meeting","Điểm %","Sản phẩm quan tâm","Phù hợp nhu cầu","Tags","Phân loại","Người phụ trách (PIC)"]
                    .concat(QUESTIONS.map(function (q) { return "Câu " + q.id + ": " + q.text; }))
                    .concat(["rawAnswers (JSON gốc)"]);
                var rows = arr.map(function (r) {
                    var c = r.customer || {}, s = r.scores || {}, ra = r.rawAnswers || {};
                    var row = [r.date||"", c.name||"", c.company||"", c.phone||"", c.email||"", c.jobTitle||"", c.consulted1v1?"x":"", c.bookedMeeting?"x":"", (s.percent!=null?s.percent:0)+"%", (r.products||[]).join(" | "), r.fit||"", (r.tags||[]).join(" | "), r.classification||"", c.pic||""];
                    QUESTIONS.forEach(function (q) { row.push(answerToText(q, ra[q.id])); });
                    row.push(JSON.stringify(ra));
                    return row;
                });
                var csv = [head].concat(rows).map(function (row) { return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
                var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a"); a.href = url; a.download = "lead-backup.csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
            },
            resyncBackup() {
                var arr = []; try { arr = JSON.parse(localStorage.getItem('smartlog_leads_mkt') || '[]'); } catch (e) {}
                if (!arr.length) { alert('Không có lead nào để đẩy.'); return; }
                if (!WEBHOOK_URL) { alert('Chưa cấu hình WEBHOOK_URL.'); return; }
                if (!confirm('Đẩy lại ' + arr.length + ' lead lên Sheet?\n(Lead đã có sẽ được BỔ SUNG câu trả lời, không tạo dòng trùng.)')) return;
                // Lead lưu trước 03/08 chưa có answersText → giải mã từ rawAnswers để Sheet nhận được câu trả lời.
                arr = arr.map(function (r) {
                    if (r && !r.answersText && r.rawAnswers) r.answersText = answersAsText(r.rawAnswers);
                    return r;
                });
                var n = 0;
                (function send(i) {
                    if (i >= arr.length) { alert('Đã gửi lại ' + n + ' lead. Mở Sheet kiểm tra nhé.'); return; }
                    fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(arr[i]) })
                        .then(function () { n++; }).catch(function () {}).then(function () { setTimeout(function () { send(i + 1); }, 250); });
                })(0);
            },

            handleInfoSubmit(e) {
                e.preventDefault();
                var picSelVal = document.getElementById('f_pic').value;
                var picFinal = picSelVal === '__other__' ? (document.getElementById('f_pic_other').value || '') : picSelVal;
                state.formData = {
                    name: document.getElementById('f_name').value,
                    company: document.getElementById('f_company').value,
                    phone: document.getElementById('f_phone').value,
                    email: document.getElementById('f_email').value,
                    jobTitle: document.getElementById('f_job').value,
                    pic: picFinal,
                    consulted1v1: document.getElementById('f_consult').checked,
                    bookedMeeting: document.getElementById('f_meeting').checked
                };
                state.surveyStep = 1;
                this.render();
            },

            togglePicOther() {
                var sel = document.getElementById('f_pic');
                var other = document.getElementById('f_pic_other');
                if (!sel || !other) return;
                if (sel.value === '__other__') { other.classList.remove('hidden'); other.focus(); }
                else { other.classList.add('hidden'); }
            },

            handleAnswer(questionId, optionIndex, isMulti) {
                if (isMulti) {
                    let cur = state.answers[questionId] || [];
                    const q = QUESTIONS.find(x => x.id === questionId);
                    const opt = q.options[optionIndex];
                    if (opt.exclusive) {
                        cur = cur.includes(optionIndex) ? [] : [optionIndex];
                    } else {
                        const exIdx = q.options.findIndex(o => o.exclusive);
                        cur = cur.filter(i => i !== exIdx);
                        cur = cur.includes(optionIndex) ? cur.filter(i => i !== optionIndex) : cur.concat([optionIndex]);
                    }
                    state.answers[questionId] = cur;
                    this.render();
                } else {
                    state.answers[questionId] = optionIndex;
                    this.render();
                    setTimeout(() => {
                        const active = getActiveQuestions();
                        if (state.surveyStep >= active.length) { app.submitSurvey(); }
                        else { state.surveyStep++; this.render(); }
                    }, 300);
                }
            },

            nextStep() { state.surveyStep++; this.render(); },
            prevStep() { if (state.surveyStep > 0) state.surveyStep--; this.render(); },

            calculateResults() {
                const active = getActiveQuestions();
                let earned = 0, maxApplicable = 0;
                let tags = [], productTags = [], fit = null;

                active.forEach(q => {
                    const answer = state.answers[q.id];
                    if (q.router) {
                        if (Array.isArray(answer)) answer.forEach(i => { const o = q.options[i]; if (o && o.tag) { tags.push(o.tag); productTags.push(o.tag); } });
                        return;
                    }
                    if (q.gate) {
                        if (answer !== undefined) { const o = q.options[answer]; if (o && o.fit) fit = o.fit; }
                        return;
                    }
                    // Câu tính điểm (quy mô theo mảng + câu chung)
                    maxApplicable += questionMax(q);
                    if (answer === undefined) return;
                    if (q.type === 'single') {
                        const o = q.options[answer]; if (!o) return;
                        earned += o.score;
                        if (o.tag) tags.push(o.tag);
                    } else if (q.type === 'multiple') {
                        let m = 0; answer.forEach(i => { const o = q.options[i]; m += o.score; if (o.tag) tags.push(o.tag); });
                        earned += Math.min(m, q.cap || 15);
                    }
                });

                const realProducts = productTags.filter(t => t !== 'UNCLEAR');
                if (realProducts.length >= 3) tags.push("CROSS_SELL_OPPORTUNITY");

                const percent = maxApplicable > 0 ? Math.round(earned / maxApplicable * 100) : 0;
                const fitPass = (fit === "Phù hợp");
                // SQL nếu ĐIỂM ≥ 70% HOẶC nhu cầu "Phù hợp" (vượt bậc). Còn lại chia MQL/Raw theo %.
                let classification;
                if (percent >= THRESHOLDS.SQL || fitPass) classification = "SQL";
                else if (percent >= THRESHOLDS.MQL) classification = "MQL";
                else classification = "Raw";
                const sqlByFit = classification === "SQL" && fitPass && percent < THRESHOLDS.SQL; // lên SQL nhờ "Phù hợp" (vượt bậc)

                return {
                    date: new Date().toISOString(),
                    customer: state.formData,
                    rawAnswers: state.answers,
                    answersText: answersAsText(state.answers),
                    products: productTags,
                    scores: { earned: earned, max: maxApplicable, percent: percent },
                    tags: tags,
                    fit: fit,
                    classification: classification,
                    sqlByFit: sqlByFit
                };
            },

            submitSurvey() {
                if (state.finished) return;   // chống gửi trùng (double-tap ở câu cuối → 2 lead giống nhau)
                state.finished = true;
                const result = this.calculateResults();
                state.lastResult = result;
                try {
                    const arr = JSON.parse(localStorage.getItem('smartlog_leads_mkt') || '[]');
                    arr.unshift(result);
                    localStorage.setItem('smartlog_leads_mkt', JSON.stringify(arr));
                } catch (e) { console.error('Local backup error:', e); }
                if (WEBHOOK_URL) {
                    fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(result) })
                        .catch(err => console.error("Webhook error:", err));
                }
                this.render();
            },

            render() {
                document.getElementById('app-container').innerHTML = this.getSurveyHTML();
                lucide.createIcons();
            },

            getSurveyHTML() {
                if (state.finished && state.lastResult) return this.getResultHTML();
                if (state.surveyStep === 0) return this.getInfoHTML();
                const active = getActiveQuestions();
                if (state.surveyStep >= 1 && state.surveyStep <= active.length) return this.getQuestionHTML(active[state.surveyStep - 1], active.length);
                return '';
            },

            getInfoHTML() {
                const jobsOptions = JOB_TITLES.map(g => `<optgroup label="${g.group}">` + g.items.map(j => `<option value="${j}" ${state.formData.jobTitle === j ? 'selected' : ''}>${j}</option>`).join('') + `</optgroup>`).join('');
                const picVal = state.formData.pic || '';
                const picIsOther = picVal !== '' && PIC_LIST.indexOf(picVal) === -1;
                const picOptions = PIC_LIST.map(n => `<option ${picVal === n ? 'selected' : ''}>${n}</option>`).join('');
                return `
                <div class="flex-grow overflow-y-auto bg-gray-50"><div class="min-h-full flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 md:p-10 border-t-8 border-primary my-auto">
                        <h1 class="text-[26px] md:text-[32px] font-bold text-primary mb-2 leading-tight">Phân loại Lead tại sự kiện</h1>
                        <p class="text-[17px] text-gray-600 mb-6">Nhập thông tin khách hàng sau khi tư vấn để hệ thống phân loại <strong>Raw / MQL / SQL</strong>. <span class="text-gray-500">Các trường không bắt buộc — lấy được thông tin nào điền thông tin đó.</span></p>
                        ${this.getBackupBoxHTML()}
                        <form onsubmit="app.handleInfoSubmit(event)" class="space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div><label class="block text-sm font-semibold mb-1 text-text">Họ và Tên</label><input type="text" id="f_name" value="${state.formData.name}" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition" /></div>
                                <div><label class="block text-sm font-semibold mb-1 text-text">Công ty</label><input type="text" id="f_company" value="${state.formData.company}" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition" /></div>
                                <div><label class="block text-sm font-semibold mb-1 text-text">Số điện thoại</label><input type="tel" id="f_phone" value="${state.formData.phone}" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition" /></div>
                                <div><label class="block text-sm font-semibold mb-1 text-text">Email</label><input type="email" id="f_email" value="${state.formData.email}" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition" /></div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1 text-text">Chức vụ</label>
                                <select id="f_job" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition">
                                    <option value="">-- Chọn chức vụ --</option>
                                    ${jobsOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-1 text-text">Người phụ trách (PIC)</label>
                                <select id="f_pic" onchange="app.togglePicOther()" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition">
                                    <option value="">-- Chọn người phụ trách --</option>
                                    ${picOptions}
                                    <option value="__other__" ${picIsOther ? 'selected' : ''}>Khác (nhập tay)</option>
                                </select>
                                <input type="text" id="f_pic_other" value="${picIsOther ? picVal : ''}" placeholder="Nhập tên người phụ trách" class="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary outline-none transition mt-2 ${picIsOther ? '' : 'hidden'}" />
                            </div>
                            <div class="bg-bg-box border border-blue-100 rounded-xl p-4">
                                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Ghi nhận tương tác tại sự kiện (không tính điểm)</p>
                                <label class="flex items-center gap-3 mb-2 cursor-pointer"><input type="checkbox" id="f_consult" ${state.formData.consulted1v1 ? 'checked' : ''} class="w-5 h-5 rounded accent-primary" /><span class="text-[15px] text-gray-700">Đã tư vấn 1:1 tại sự kiện</span></label>
                                <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="f_meeting" ${state.formData.bookedMeeting ? 'checked' : ''} class="w-5 h-5 rounded accent-primary" /><span class="text-[15px] text-gray-700">Đã book meeting với khách hàng sau sự kiện</span></label>
                            </div>
                            <button type="submit" class="w-full btn-primary text-lg font-bold py-4 rounded-xl mt-2 flex justify-center items-center gap-2 shadow-lg">Bắt đầu đánh giá <i data-lucide="chevron-right"></i></button>
                        </form>
                    </div>
                    </div>
                </div>`;
            },

            getQuestionHTML(q, total) {
                const isMulti = q.type === 'multiple';
                const currentAnswer = state.answers[q.id];
                const progress = (state.surveyStep / total) * 100;
                const optionsHTML = q.options.map((opt, idx) => {
                    const isSelected = isMulti ? (currentAnswer || []).includes(idx) : currentAnswer === idx;
                    const baseClass = isSelected ? 'border-primary bg-bg-box' : 'border-gray-200 bg-white hover:border-blue-300';
                    const textClass = isSelected ? 'font-semibold text-primary' : 'text-gray-700';
                    const iconClass = isSelected ? 'border-primary bg-primary' : 'border-gray-300';
                    const roundedIcon = isMulti ? 'rounded-md' : 'rounded-full';
                    const isNoInfo = opt.score === 0 && !opt.tag && !opt.fit;
                    const extra = (isNoInfo && !isSelected) ? 'italic text-gray-400' : '';
                    return `<button onclick="app.handleAnswer(${q.id}, ${idx}, ${isMulti})" class="w-full text-left p-4 md:p-5 rounded-xl border-2 transition-all flex items-center justify-between gap-3 group ${baseClass}"><span class="text-[17px] ${textClass} ${extra}">${opt.text}</span><div class="w-6 h-6 border-2 flex items-center justify-center shrink-0 ${roundedIcon} ${iconClass}">${isSelected ? '<i data-lucide="check" class="text-white w-4 h-4"></i>' : ''}</div></button>`;
                }).join('');
                const nextDisabled = isMulti && (!currentAnswer || currentAnswer.length === 0);
                const isLast = state.surveyStep === total;
                return `
                <div class="flex-grow flex flex-col overflow-hidden">
                    <div class="w-full bg-gray-200 h-2 shrink-0"><div class="bg-highlight h-2 transition-all duration-500" style="width: ${progress}%"></div></div>
                    <div class="flex-grow overflow-y-auto bg-gray-50">
                        <div class="min-h-full flex items-center justify-center p-4">
                            <div class="max-w-3xl w-full">
                                <div class="mb-4 text-sm font-bold text-highlight uppercase tracking-wider">Câu hỏi ${state.surveyStep} / ${total}</div>
                                <h2 class="text-[24px] md:text-[30px] font-bold text-text mb-6 leading-tight bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-gray-100">${q.text}</h2>
                                <div class="space-y-3">${optionsHTML}</div>
                                <div class="mt-8 flex justify-between items-center">
                                    <button onclick="app.prevStep()" class="px-6 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-200 transition flex items-center gap-2"><i data-lucide="chevron-left"></i> Quay lại</button>
                                    ${isMulti ? `<button onclick="${isLast ? 'app.submitSurvey()' : 'app.nextStep()'}" ${nextDisabled ? 'disabled' : ''} class="px-8 py-3 rounded-xl font-bold flex items-center gap-2 transition-all ${nextDisabled ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'btn-primary shadow-md'}">${isLast ? 'Hoàn thành' : 'Tiếp tục'} <i data-lucide="chevron-right"></i></button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            getResultHTML() {
                const r = state.lastResult;
                const c = CLASSES[r.classification];
                const prodHTML = (r.products || []).filter(t => t !== 'UNCLEAR').map(t => `<span class="px-2.5 py-1 bg-blue-50 text-primary border border-blue-100 rounded-lg text-xs font-bold">${t}</span>`).join('');
                return `
                <div class="flex-grow flex items-center justify-center p-4 bg-primary overflow-y-auto">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 md:p-10 relative overflow-hidden my-auto text-center">
                        <div class="absolute top-0 left-0 w-full h-2 bg-highlight"></div>
                        <div class="flex items-center justify-center gap-1.5 text-green-600 text-sm font-semibold mb-4"><i data-lucide="check" class="w-4 h-4"></i> Đã lưu lead</div>
                        <div class="mb-5"><div class="text-xl font-bold text-gray-800">${r.customer.name || 'Khách hàng'}</div>${r.customer.company ? `<div class="text-sm text-gray-500 mt-0.5">${r.customer.company}</div>` : ''}${r.customer.pic ? `<div class="text-xs text-gray-400 mt-1">PIC: ${r.customer.pic}</div>` : ''}</div>
                        <div class="flex justify-center mb-4">
                            <div class="px-8 py-4 rounded-2xl ${c.color} text-white shadow-lg"><div class="text-3xl font-black tracking-tight">${c.emoji} ${c.label}</div></div>
                        </div>
                        ${r.sqlByFit ? `<p class="text-xs text-highlight font-bold mb-4">⭐ Vượt bậc lên SQL nhờ nhu cầu "Phù hợp"</p>` : ''}
                        <div class="mb-5">
                            <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Điểm phù hợp</div>
                            <div class="text-5xl font-black text-primary leading-none mt-1">${r.scores.percent}<span class="text-2xl text-gray-400 font-normal">%</span></div>
                        </div>
                        ${prodHTML ? `<div class="flex flex-wrap gap-1.5 justify-center mb-6">${prodHTML}</div>` : '<div class="mb-6"></div>'}
                        <button onclick="window.location.reload()" class="w-full btn-primary text-lg font-bold py-4 rounded-xl flex justify-center items-center gap-2 shadow-lg"><i data-lucide="plus"></i> Nhập lead mới</button>
                    </div>
                </div>`;
            }
        };

        app.init();
    </script>
